name: Deploy Dashboard

# Best-practice CI/CD:
#  1. CI GATE  — build on a GitHub runner to catch breakage BEFORE prod.
#  2. DEPLOY   — SSH into the prod host and run our release-based deploy
#                script (atomic flip + health-gated rollback).
#
# Triggered on push to main that touches dashboard code, or manually.

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'types/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'ecosystem.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  # ---- 1. CI gate: prove it builds before we touch production ----
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build (Next.js)
        run: npm run build
        env:
          # NEXT_PUBLIC_* is baked at build time; the real value is set on the
          # host via shared/.env.production. CI just needs the build to pass.
          NEXT_PUBLIC_API_URL: https://api.haikuy.com/api/v1

  # ---- 2. Deploy: only runs if build passed ----
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (release-based, health-gated)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/.openclaw/workspace/arasya-projects
            GIT_SYNC=1 ./deploy-local.sh dashboard
