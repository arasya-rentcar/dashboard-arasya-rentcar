name: Deploy to Vercel

# Vercel Hobby (free) can't link a private repo owned by an organization,
# so we build and deploy with the Vercel CLI from GitHub Actions instead.
#
# Required repo secret: VERCEL_TOKEN (vercel.com/account/tokens).
# NEXT_PUBLIC_API_URL is set in the Vercel project's environment variables.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_BTCfzpj2KUcWMm6yyY4MtXR1
  VERCEL_PROJECT_ID: prj_gPEqRB9KUj6lEcyRxQgar0A6DSLG

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
